<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deck QR</title>
  <style>
    :root { --ink: #1d1d1f; --muted: #6b6b70; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    :root[data-theme="dark"] { --ink: #ececee; --muted: #9a9ba1; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; background: transparent; color: var(--ink); }
    /* Fill the iframe: QR as large as fits, caption underneath. */
    main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1vh; padding: 1vh; text-align: center; }
    /* main is a size container: the code is the largest square that fits
       beside the caption's height (--cap), and code + caption stay centered together. */
    main { container-type: size; --big: calc(clamp(.8rem, 4.5vh, 2rem) * 1.4 + 1vh); --small: calc(clamp(.65rem, 3vh, 1.1rem) * 1.4 + 1vh); --cap: var(--big); }
    main.twoline { --cap: calc(var(--big) + var(--small)); }
    main.nocap { --cap: var(--small); }
    #qr { --s: min(100cqw, calc(100cqh - var(--cap))); width: var(--s); height: var(--s); flex: none; background: #fff; padding: 4%; border-radius: 3%; /* white quiet zone so it scans on dark slides */ }
    #qr svg { display: block; width: 100%; height: 100%; }
    .cap { max-width: 100%; font-size: clamp(.8rem, 4.5vh, 2rem); font-weight: 600; word-break: break-all; }
    .dest { max-width: 100%; font-size: clamp(.65rem, 3vh, 1.1rem); color: var(--muted); word-break: break-all; }
    .dest b, .cap b { color: var(--ink); }
    .hint { color: var(--muted); max-width: 40em; line-height: 1.5; }
    code { background: rgb(127 127 127 / .15); padding: .1em .35em; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <div id="qr" hidden></div>
    <div id="cap" class="cap" hidden></div>
    <div id="dest" class="dest" hidden></div>
    <p id="hint" class="hint" hidden>
      Add the address to encode to this page's URL, e.g.<br>
      <code>?url=https://slides.com/you/your-deck</code><br>
      Optional: <code>&amp;label=Follow along</code> (or <code>&amp;label=</code> for none), <code>&amp;theme=dark</code><br>
      The destination address is always shown, so a label can't disguise where the code goes.
    </p>
  </main>

  <script src="vendor/qrcode.js"></script>
  <script>
    const p = new URLSearchParams(location.search);
    document.documentElement.dataset.theme = p.get('theme') || 'light';

    // An iframe can't read its parent's address, so ?url= is normally required.
    // Fall back to the referrer only if it carries a full path.
    let url = p.get('url');
    try {
      if (!url && document.referrer && new URL(document.referrer).pathname.length > 1) url = document.referrer;
    } catch {}

    // Parse with the browser's own URL rules, then show and encode that same
    // normalized address. This exposes tricks like https://slides.com@evil.com
    // (host is evil.com) and lookalike Unicode domains (shown as xn--…).
    let dest = null;
    try {
      const u = new URL(url);
      if (u.protocol === 'http:' || u.protocol === 'https:') dest = u;
    } catch {}

    // "slides.com/djjr/deck" with the host in bold, built as text nodes (never HTML).
    function showAddress(el, u) {
      const rest = (u.pathname === '/' ? '' : u.pathname) + u.search + u.hash;
      const host = document.createElement('b');
      host.textContent = u.host;
      el.replaceChildren(host, rest);
      el.hidden = false;
    }

    if (dest) {
      const href = dest.href;
      qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
      const qr = qrcode(0, 'M'); // auto size, medium error correction
      qr.addData(href);
      qr.make();
      const box = document.getElementById('qr');
      box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true, alt: 'QR code for ' + href });
      box.hidden = false;

      const label = p.get('label');
      const main = document.querySelector('main');
      const cap = document.getElementById('cap');
      if (label === null) {
        showAddress(cap, dest);             // default: the address is the caption
      } else {
        if (label) {
          cap.textContent = label;
          cap.hidden = false;
          main.classList.add('twoline');
        } else {
          main.classList.add('nocap');      // label= hides only the big caption
        }
        showAddress(document.getElementById('dest'), dest);
      }
    } else {
      document.getElementById('hint').hidden = false;
    }
  </script>
</body>
</html>
